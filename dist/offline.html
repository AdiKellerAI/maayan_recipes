<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>לא מחובר לאינטרנט</title>
    <meta name="description" content="האפליקציה זמינה גם ללא חיבור לאינטרנט">
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; margin: 0; padding: 0; background: #fff7ed; color: #111827; }
      .wrap { max-width: 520px; margin: 10vh auto; padding: 24px; text-align: center; }
      .card { background: white; border: 1px solid #fde68a; border-radius: 16px; padding: 24px; box-shadow: 0 8px 20px rgb(0 0 0 / 6%); }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 12px; font-size: 14px; }
      .btn { display: inline-block; margin-top: 8px; background: linear-gradient(135deg, #f97316, #f59e0b); border: 0; color: white; padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>אתם לא מחוברים לאינטרנט</h1>
        <p>תוכלו להמשיך לצפות במתכונים שנשמרו במכשיר.</p>
        <p>חזרו לכאן כשיהיה חיבור כדי לראות עדכונים חדשים.</p>
        <a href="/" class="btn">חזרה לדף הבית</a>
      </div>
    </div>
  </body>
</html>
